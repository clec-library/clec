<style>
:root{--bg:#f4efe4;--fg:#2b2b2b;--bar:#2f2f2f;--barfg:#fff;--panel:#fff;--muted:#6b6b6b;--btn:#4a4a4a;--accent:#8b5a2b}

body.green{--bg:#cce8c9;--fg:#1f2a1c;--panel:#e7f5e5;--bar:#2e4a2c}
#bar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:6px;padding:0 8px;padding-top:env(safe-area-inset-top);background:var(--bar);color:var(--barfg);z-index:20;box-sizing:border-box}
#bar .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#view{position:absolute;top:48px;bottom:48px;left:0;right:0;top:calc(48px + env(safe-area-inset-top));bottom:calc(48px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}

#nav{position:fixed;bottom:0;left:0;right:0;height:48px;height:calc(48px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;padding-left:12px;padding-right:12px;background:var(--panel);box-sizing:border-box;font-size:13px;z-index:20;border-top:1px solid #0002}
#nav button{background:var(--bar);color:var(--barfg);border:0;border-radius:8px;padding:8px 16px;font-size:14px}

#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:15px;color:var(--muted);padding:0 28px;z-index:10;background:var(--bg)}
#msg.hide{display:none}
#msg .hint{font-size:13px;margin-top:8px;opacity:.8}
.spinner{width:28px;height:28px;border:3px solid #0002;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
#prog{width:200px;height:6px;background:#0002;border-radius:99px;margin-top:14px;overflow:hidden;display:none}
#prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
#mask{display:none;position:fixed;inset:0;background:#0005;z-index:30}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--fg);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:31;box-shadow:0 -8px 32px #0003}
#panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.row label{width:56px;font-size:13px;color:var(--muted);flex-shrink:0}
.row button,.row .chip{background:#00000010;color:var(--fg);border:1px solid transparent;border-radius:8px;padding:7px 11px;font-size:13px}
.row button.on,.row .chip.on{background:var(--accent);color:#fff;border-color:transparent}
#panel .close{float:right;background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
</style>

<div id="bar">

<div id="panel" role="dialog" aria-label="阅读设置">
  <button type="button" class="close" id="closeSet">×</button>
  <h3>阅读设置</h3>
  <div class="row"><label>字体</label>
    <button type="button" class="chip" data-k="font" data-v="default">系统</button>
    <button type="button" class="chip" data-k="font" data-v="hei">黑体</button>

  </div>
  <div class="row"><label>行距</label>
    <button type="button" class="chip" data-k="lh" data-v="1.5">紧凑</button>
    <button type="button" class="chip" data-k="lh" data-v="1.8">适中</button>
    <button type="button" class="chip" data-k="lh" data-v="2.1">宽松</button>
  </div>
  <div class="row"><label>背景</label>
    <button type="button" class="chip" data-k="theme" data-v="paper">米色</button>
    <button type="button" class="chip" data-k="theme" data-v="white">白色</button>

    <button type="button" class="chip" data-k="sound" data-v="fire">壁炉</button>
    <button type="button" class="chip" data-k="sound" data-v="stream">溪流</button>
    <button type="button" class="chip" data-k="sound" data-v="pink">粉噪</button>
    <button type="button" class="chip" data-k="sound" data-v="pad">轻柔</button>
  </div>
  <p style="font-size:12px;color:var(--muted);margin:4px 0 0">适合阅读的自然环境音，在本地即时生成，不另下载，可随时关掉。</p>
  <p id="pdfNote" style="display:none;font-size:12px;color:var(--muted);margin:8px 0 0">PDF 版面是固定的，字体和行距改的是菜单；背景颜色会作用在页面四周。</p>
</div>
<script>
const BASE="https://pub-fc3f445745ea452f882ce28d1361de6f.r2.dev/";
const LOCAL=new URL(".", location.href).href;
const FONTS={
  default:'-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',
  hei:'"PingFang SC","Heiti SC","Noto Sans SC","Microsoft YaHei",sans-serif',
  song:'"Songti SC","STSong","SimSun","Noto Serif SC",serif',
  kai:'"Kaiti SC","STKaiti","KaiTi","STKaiTi",serif'
};
const q=new URLSearchParams(location.search);
const key=q.get("f")||"";
const name=q.get("t")||key.replace(/\.[^.]+$/,"");
const url=BASE+key.split("/").map(encodeURIComponent).join("/");
const ext=(key.split(".").pop()||"").toLowerCase();
const isPdf=ext==="pdf", isEpub=ext==="epub";
const msg=document.getElementById("msg"), msgt=document.getElementById("msgt");
const view=document.getElementById("view"), posEl=document.getElementById("pos");
document.title=name+" · CLEC 电子书";
document.getElementById("title").textContent=name||"CLEC 电子书";
document.getElementById("dl").href=url;
if(!isEpub) document.getElementById("toc").style.display="none";
if(isPdf) document.getElementById("pdfNote").style.display="block";

let actx, masterGain, soundNodes=[], soundTimers=[], playingSound="off";
const pref=Object.assign({font:"default",fs:100,lh:"1.8",theme:"paper",music:false,sound:"off"}, JSON.parse(localStorage.getItem("clec-read")||"{}"));
if(!pref.sound || pref.sound===true) pref.sound=pref.music?"pad":"off";
function savePref(){localStorage.setItem("clec-read", JSON.stringify(pref));}
function applyChrome(){
  document.body.className=pref.theme==="paper"?"":pref.theme;
  document.querySelectorAll("[data-k]").forEach(b=>{
    const cur=b.dataset.k==="sound"?(playingSound||"off"):pref[b.dataset.k];
    b.classList.toggle("on", String(cur)===b.dataset.v);
  });
  document.getElementById("fsVal").textContent=pref.fs+"%";
}
applyChrome();

/* ---- 背景音：本地生成的自然环境声，不另下文件 ---- */
const noiseCache={};
function noiseBuf(sec, kind){
  const key=kind+"_"+sec;
  if(noiseCache[key]) return noiseCache[key];
  const rate=actx.sampleRate, n=Math.floor(rate*sec);
  const buf=actx.createBuffer(1,n,rate), d=buf.getChannelData(0);
  if(kind==="white"){
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }else if(kind==="brown"){
    let last=0;
    for(let i=0;i<n;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=Math.max(-1,Math.min(1,last*3.5)); }
  }else{
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
      b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
  }
  return noiseCache[key]=buf;
}
function track(n){ soundNodes.push(n); return n; }
function loopSrc(buf){ const s=actx.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return track(s); }
function filt(type,freq,q){ const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q!=null) f.Q.value=q; return track(f); }
function gain(v){ const g=actx.createGain(); g.gain.value=v; return track(g); }
function lfoTo(param,freq,depth){
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=freq;
  const g=actx.createGain(); g.gain.value=depth;
  o.connect(g); g.connect(param); o.start(); track(o); track(g); return o;
}
function later(fn,ms){ const id=setTimeout(fn,ms); soundTimers.push(id); return id; }

function stopSound(){
  soundTimers.forEach(clearTimeout); soundTimers=[];
  const nodes=soundNodes.slice(), mg=masterGain;
  soundNodes=[]; masterGain=null; playingSound="off";
  if(!mg||!actx) return;
  try{ const t=actx.currentTime; mg.gain.cancelScheduledValues(t); mg.gain.setValueAtTime(mg.gain.value,t); mg.gain.linearRampToValueAtTime(0,t+0.3);}catch(e){}
  setTimeout(()=>{ nodes.forEach(n=>{try{n.stop&&n.stop(); n.disconnect();}catch(e){}}); try{mg.disconnect();}catch(e){} }, 350);
}

function startSound(id){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){ pref.sound="off"; savePref(); return; }
  actx=actx||new AC();
  if(actx.state==="suspended") actx.resume();
  stopSound();
  if(!id||id==="off"){ applyChrome(); return; }
  masterGain=actx.createGain(); masterGain.gain.value=0; masterGain.connect(actx.destination);
  const out=masterGain, now=actx.currentTime;
  if(id==="rain"){
    const a=loopSrc(noiseBuf(3,"pink")), hp=filt("highpass",400), lp=filt("lowpass",7000), g=gain(0.22);
    a.connect(hp); hp.connect(lp); lp.connect(g); g.connect(out);
    const b=loopSrc(noiseBuf(4,"brown")), lp2=filt("lowpass",200), g2=gain(0.06);
    b.connect(lp2); lp2.connect(g2); g2.connect(out);
    const drip=()=>{
      if(playingSound!=="rain") return;
      const src=actx.createBufferSource(); src.buffer=noiseBuf(2,"white");
      const f=filt("bandpass",1800+Math.random()*2200,4), dg=gain(0);
      src.connect(f); f.connect(dg); dg.connect(out);
      const t=actx.currentTime, dur=0.04+Math.random()*0.07;
      dg.gain.setValueAtTime(0.08+Math.random()*0.1,t); dg.gain.exponentialRampToValueAtTime(0.001,t+dur);
      src.start(t); src.stop(t+dur+0.02); later(drip,200+Math.random()*900);
    };
    later(drip,400);
    out.gain.linearRampToValueAtTime(0.7, now+1);
  }else if(id==="ocean"){
    const a=loopSrc(noiseBuf(5,"brown")), lp=filt("lowpass",500), g=gain(0.55);
    lp.frequency.value=420; lfoTo(lp.frequency,0.07,260); lfoTo(g.gain,0.08,0.2);
    a.connect(lp); lp.connect(g); g.connect(out);
    const foam=loopSrc(noiseBuf(3,"white")), hp=filt("highpass",700), lp2=filt("lowpass",2800), g2=gain(0.08);
    lfoTo(g2.gain,0.11,0.04);
    foam.connect(hp); hp.connect(lp2); lp2.connect(g2); g2.connect(out);
    out.gain.linearRampToValueAtTime(0.85, now+1.4);
  }else if(id==="forest"){
    const a=loopSrc(noiseBuf(5,"brown")), lp=filt("lowpass",500), g=gain(0.22);
    lfoTo(g.gain,0.05,0.08); lfoTo(lp.frequency,0.04,120);
    a.connect(lp); lp.connect(g); g.connect(out);
    const leaves=loopSrc(noiseBuf(3,"pink")), hp=filt("highpass",1200), lp2=filt("lowpass",4000), g2=gain(0.04);
    leaves.connect(hp); hp.connect(lp2); lp2.connect(g2); g2.connect(out);
    const bird=()=>{
      if(playingSound!=="forest") return;
      const o=actx.createOscillator(); o.type="sine";
      const f0=1600+Math.random()*1400; o.frequency.setValueAtTime(f0,actx.currentTime);
      o.frequency.linearRampToValueAtTime(f0+(Math.random()<.5?-400:350), actx.currentTime+0.18);
      const bg=gain(0); const t=actx.currentTime;
      bg.gain.setValueAtTime(0.0001,t); bg.gain.linearRampToValueAtTime(0.03,t+0.04); bg.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(bg); bg.connect(out); o.start(t); o.stop(t+0.22);
      later(bird,6000+Math.random()*10000);
    };
    later(bird,3000);
    out.gain.linearRampToValueAtTime(0.8, now+1.2);
  }else if(id==="fire"){
    const rumble=loopSrc(noiseBuf(4,"brown")), lp=filt("lowpass",180), g=gain(0.28);
    rumble.connect(lp); lp.connect(g); g.connect(out);
    const hiss=loopSrc(noiseBuf(2,"pink")), hp=filt("highpass",800), lp2=filt("lowpass",2400), g2=gain(0.05);
    hiss.connect(hp); hp.connect(lp2); lp2.connect(g2); g2.connect(out);
    const crack=()=>{
      if(playingSound!=="fire") return;
      const src=actx.createBufferSource(); src.buffer=noiseBuf(2,"white");
      const f=filt("bandpass",1500+Math.random()*3500,2.5), cg=gain(0);
      src.connect(f); f.connect(cg); cg.connect(out);
      const t=actx.currentTime, dur=0.02+Math.random()*0.05;
      cg.gain.setValueAtTime(0.1+Math.random()*0.18,t); cg.gain.exponentialRampToValueAtTime(0.001,t+dur);
      src.start(t); src.stop(t+dur+0.02); later(crack,80+Math.random()*420);
    };
    later(crack,200);
    out.gain.linearRampToValueAtTime(0.75, now+0.8);
  }else if(id==="stream"){
    const a=loopSrc(noiseBuf(3,"white")), bp=filt("bandpass",1100,0.8), g=gain(0.18);
    a.connect(bp); bp.connect(g); g.connect(out);
    const b=loopSrc(noiseBuf(3,"pink")), bp2=filt("bandpass",2600,1.1), g2=gain(0.09);
    lfoTo(bp2.frequency,0.13,400);
    b.connect(bp2); bp2.connect(g2); g2.connect(out);
    const bubble=()=>{
      if(playingSound!=="stream") return;
      const o=actx.createOscillator(); o.type="sine";
      const f0=500+Math.random()*900; o.frequency.setValueAtTime(f0,actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(180,f0-300), actx.currentTime+0.12);
      const bg=gain(0), lp=filt("lowpass",2000); const t=actx.currentTime;
      bg.gain.setValueAtTime(0.05,t); bg.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.connect(lp); lp.connect(bg); bg.connect(out); o.start(t); o.stop(t+0.14);
      later(bubble,300+Math.random()*1100);
    };
    later(bubble,500);
    out.gain.linearRampToValueAtTime(0.7, now+1);
  }else if(id==="pink"){
    const a=loopSrc(noiseBuf(4,"pink")), lp=filt("lowpass",6000), g=gain(0.16);
    a.connect(lp); lp.connect(g); g.connect(out);
    out.gain.linearRampToValueAtTime(0.7, now+0.8);
  }else{
    const make=(freq,type,detune)=>{
      const o=actx.createOscillator(); o.type=type; o.frequency.value=freq; o.detune.value=detune;
      const g=gain(0.35), f=filt("lowpass",900);
      o.connect(g); g.connect(f); f.connect(out); o.start(); return track(o);
    };
    make(110,"sine",0); make(164.81,"sine",6); make(220,"triangle",-4);
    lfoTo(out.gain,0.07,0.012);
    out.gain.linearRampToValueAtTime(0.045, now+1.2);
  }
  playingSound=id;
}

function setSound(id){
  pref.sound=id; pref.music=(id!=="off"); savePref();
  startSound(id);
  applyChrome();
}

document.getElementById("setBtn").onclick=()=>{document.getElementById("mask").style.display="block";document.getElementById("panel").style.display="block";};
function closeSet(){document.getElementById("mask").style.display="none";document.getElementById("panel").style.display="none";}
document.getElementById("mask").onclick=closeSet;
document.getElementById("closeSet").onclick=closeSet;
document.getElementById("fsDown").onclick=()=>{pref.fs=Math.max(80,pref.fs-10);savePref();applyChrome();applyBookStyle();};
document.getElementById("fsUp").onclick=()=>{pref.fs=Math.min(180,pref.fs+10);savePref();applyChrome();applyBookStyle();};
document.getElementById("panel").addEventListener("click",e=>{
  const b=e.target.closest("[data-k]"); if(!b) return;
  if(b.dataset.k==="sound"){ setSound(b.dataset.v); return; }
  pref[b.dataset.k]=b.dataset.v;
  savePref(); applyChrome(); applyBookStyle();
});

let applyBookStyle=()=>{};
let goPrev=()=>{}, goNext=()=>{};
document.getElementById("prev").onclick=()=>goPrev();
document.getElementById("next").onclick=()=>goNext();
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowLeft"||e.key==="PageUp") goPrev();
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") {e.preventDefault(); goNext();}
});

if(!key||key.includes("..")){msgt.textContent="链接不完整，请回到电子书库重新点书名。";document.querySelector(".spinner").style.display="none";document.getElementById("hint").style.display="none";}
else if(isPdf) openPdf();
else if(isEpub) openEpub();
else {msgt.innerHTML='这个格式暂不支持在线阅读，请点右上角「下载」。';document.querySelector(".spinner").style.display="none";}

function withTimeout(p,ms,label){
  return Promise.race([
    p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||"加载")+"超时")),ms))
  ]);
}
function loadScript(src,ms){
  ms=ms||8000;
  return withTimeout(new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.async=true;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("脚本加载失败: "+src));
    document.head.appendChild(s);
  }), ms, "脚本");
}
function loadModule(src,ms){
  return withTimeout(import(src), ms||8000, "组件");
}

async function openPdf(){
  msgt.textContent="正在加载阅读组件…";
  document.getElementById("hint").textContent="不用下载整本，只加载当前页。打开后翻页会快很多。";
  const sources=[
    {pdf:LOCAL+"pdfjs/build/pdf.mjs", worker:LOCAL+"pdfjs/build/pdf.worker.mjs", cmap:LOCAL+"pdfjs/web/cmaps/", font:LOCAL+"pdfjs/web/standard_fonts/"},
    {pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs", worker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs", cmap:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/", font:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/"},
    {pdf:"https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs", worker:"https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs", cmap:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/", font:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/"}
  ];
  let pdfjsLib=null, src=null;
  for(const s of sources){
    try{ pdfjsLib=await loadModule(s.pdf, 8000); src=s; break; }
    catch(e){ console.warn("pdf.js 加载失败", s.pdf, e); }
  }
  if(!pdfjsLib){ msgt.textContent="阅读组件加载失败，请检查网络后刷新，或点右上角「下载」。"; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc=src.worker;
  msgt.textContent="正在打开第一页…";
  try{
    const task=pdfjsLib.getDocument({
      url,
      cMapUrl:src.cmap,
      cMapPacked:true,
      standardFontDataUrl:src.font,
      disableAutoFetch:true,
      disableStream:false,
      disableRange:false,
      rangeChunkSize:262144,
      withCredentials:false
    });
    const pdf=await task.promise;
    let pageNo=Math.max(1, parseInt(localStorage.getItem("clec-pdf:"+key)||"1",10)||1);
    if(pageNo>pdf.numPages) pageNo=1;
    view.classList.add("pdf");
    const canvas=document.createElement("canvas");
    view.appendChild(canvas);
    let rendering=false, pending=null;
    async function render(n){
      if(rendering){pending=n;return;}
      rendering=true; pageNo=n;
      localStorage.setItem("clec-pdf:"+key, String(n));
      const page=await pdf.getPage(n);
      const vw=Math.max(280, view.clientWidth||document.documentElement.clientWidth);
      const unscaled=page.getViewport({scale:1});
      const scale=Math.min(2.4, (vw-8)/unscaled.width) * (window.devicePixelRatio||1);
      const vp=page.getViewport({scale});
      canvas.width=vp.width; canvas.height=vp.height;
      canvas.style.width=Math.floor(vp.width/(window.devicePixelRatio||1))+"px";
      canvas.style.height=Math.floor(vp.height/(window.devicePixelRatio||1))+"px";
      await page.render({canvasContext:canvas.getContext("2d",{alpha:false}), viewport:vp}).promise;
      posEl.innerHTML='<input id="pg" type="number" min="1" max="'+pdf.numPages+'" value="'+n+'"> / '+pdf.numPages;
      const inp=document.getElementById("pg");
      inp.onchange=()=>{const v=Math.min(pdf.numPages, Math.max(1, parseInt(inp.value,10)||1)); render(v);};
      msg.classList.add("hide");
      rendering=false;
      if(pending && pending!==n){const p=pending;pending=null;render(p);}
      else pending=null;
    }
    goPrev=()=>{if(pageNo>1) render(pageNo-1);};
    goNext=()=>{if(pageNo<pdf.numPages) render(pageNo+1);};
    applyBookStyle=()=>{/* PDF 版面固定，仅背景随主题 */};
    await render(pageNo);
    let x0=null;
    view.addEventListener("touchstart",e=>{x0=e.changedTouches[0].screenX;},{passive:true});
    view.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].screenX-x0;if(dx>50)goPrev();if(dx<-50)goNext();x0=null;},{passive:true});
  }catch(e){
    console.error(e);
    msgt.textContent="打开失败，请检查网络后刷新，或点右上角「下载」。";
  }
}

async function openEpub(){
  msgt.textContent="正在加载阅读组件…";
  document.getElementById("hint").textContent="电子书需要先加载整本（一般只有几兆），加载时可看进度。";
  try{
    await loadScript(LOCAL+"jszip.min.js", 8000);
    await loadScript(LOCAL+"epub.min.js", 8000);
  }catch(e){
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", 8000);
      await loadScript("https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js", 8000);
    }catch(e2){ msgt.textContent="阅读组件加载失败，请检查网络后刷新，或点右上角「下载」。"; return; }
  }
  if(typeof ePub!=="function"){ msgt.textContent="阅读组件加载失败，请刷新后重试，或点右上角「下载」。"; return; }
  try{
    const buf=await downloadWithProgress(url);
    msgt.textContent="正在排版…";
    const book=ePub();
    await withTimeout(book.open(buf, "binary"), 20000, "打开电子书");
    const w=Math.max(280, view.clientWidth||document.documentElement.clientWidth||window.innerWidth);
    const h=Math.max(320, view.clientHeight||(window.innerHeight-96));
    const rend=book.renderTo(view,{width:w,height:h,flow:"paginated",spread:"none",allowScriptedContent:false});
    applyBookStyle=()=>{
      rend.themes.font(FONTS[pref.font]||FONTS.default);
      rend.themes.fontSize(pref.fs+"%");
      const bg=getComputedStyle(document.body).backgroundColor;
      const fg=getComputedStyle(document.body).color;
      rend.themes.override("background", bg);
      rend.themes.override("color", fg);
      rend.themes.default({body:{"line-height":pref.lh+" !important","padding":"0 10px !important","background":bg+" !important","color":fg+" !important","font-family":(FONTS[pref.font]||FONTS.default)+" !important"},p:{"line-height":pref.lh+" !important"},a:{"color":fg+" !important"}});
    };
    const saved=localStorage.getItem("clec-pos:"+key);
    try{
      await withTimeout(rend.display(saved||undefined), 20000, "排版");
    }catch(err){
      if(saved){ try{ localStorage.removeItem("clec-pos:"+key); }catch(e){} await withTimeout(rend.display(), 20000, "排版"); }
      else throw err;
    }
    applyBookStyle();
    msg.classList.add("hide");
    window.addEventListener("resize",()=>{
      const nw=Math.max(280, view.clientWidth||window.innerWidth);
      const nh=Math.max(320, view.clientHeight||(window.innerHeight-96));
      if(rend.resize) rend.resize(nw, nh);
    });
    book.loaded.navigation.then(nav=>{
      const sel=document.getElementById("toc");
      const add=(items,d)=>items.forEach(i=>{const o=document.createElement("option");o.value=i.href;o.textContent="　".repeat(d)+(i.label||"").trim();sel.appendChild(o);if(i.subitems)add(i.subitems,d+1);});
      add(nav.toc,0);
      sel.onchange=()=>{if(sel.value) rend.display(sel.value); sel.selectedIndex=0;};
    });
    rend.on("relocated",loc=>{
      localStorage.setItem("clec-pos:"+key, loc.start.cfi);
      const p=loc.start.displayed;
      posEl.textContent=p?("本章 "+p.page+" / "+p.total):"";
    });
    goPrev=()=>rend.prev();
    goNext=async()=>{
      const before=rend.currentLocation && rend.currentLocation();
      await rend.next();
      const after=rend.currentLocation && rend.currentLocation();
      if(before && after && before.start && after.start && before.start.cfi===after.start.cfi){
        const idx=before.start.index;
        const item=book.spine.get(idx+1);
        if(item) rend.display(item.href);
      }
    };
    let x0=null;
    view.addEventListener("touchstart",e=>{x0=e.changedTouches[0].screenX;},{passive:true});
    view.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].screenX-x0;if(dx>50)goPrev();if(dx<-50)goNext();x0=null;},{passive:true});
  }catch(e){
    console.error(e);
    msgt.textContent="打开失败，请检查网络后刷新，或点右上角「下载」。";
  }
}

async function downloadWithProgress(u){
  const bar=document.getElementById("prog"); const i=bar.querySelector("i");
  bar.style.display="block";
  const res=await fetch(u);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const total=Number(res.headers.get("Content-Length")||0);
  if(!res.body||!res.body.getReader) return await res.arrayBuffer();
  const reader=res.body.getReader();
  const chunks=[]; let rec=0;
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    chunks.push(value); rec+=value.length;
    if(total){ i.style.width=Math.min(100, rec/total*100)+"%"; msgt.textContent="正在加载 "+(rec/1e6).toFixed(1)+" / "+(total/1e6).toFixed(1)+" MB"; }
    else { msgt.textContent="正在加载 "+(rec/1e6).toFixed(1)+" MB"; }
  }
  const out=new Uint8Array(rec); let off=0;
  chunks.forEach(c=>{out.set(c,off);off+=c.length;});
  return out.buffer;
}
