function fontStack(id){

}
const FONTS={default:fontStack("default"),hei:fontStack("hei"),song:fontStack("song"),kai:fontStack("kai")};
const q=new URLSearchParams(location.search);

let actx, masterGain, soundNodes=[], soundTimers=[], playingSound="off";

const loadedWebFaces={};
const webFontPending={};

const pref=Object.assign({font:"default",fs:100,lh:"1.8",theme:"paper",music:false,sound:"off"}, JSON.parse(localStorage.getItem("clec-read")||"{}"));
if(!pref.sound || pref.sound===true) pref.sound=pref.music?"pad":"off";

}
function applyChrome(){

function typoCss(doc){
  const fam=fontStack(pref.font);
  const lh=pref.lh;
  const fs=(16*(Number(pref.fs)||100)/100).toFixed(2)+"px";
  const bg=getComputedStyle(document.body).backgroundColor;
  const fg=getComputedStyle(document.body).color;
  let faces="";
  Object.keys(loadedWebFaces).forEach(id=>{
    const rec=loadedWebFaces[id];
    if(doc&&doc.documentElement&&doc.documentElement.getAttribute("data-clec-ff-"+rec.family)) return;
    faces+='@font-face{font-family:"'+rec.family+'";src:url("'+rec.url+'") format("woff2");font-weight:400;font-style:normal;font-display:swap;}';
  });
  const sel="body,p,div,span,li,h1,h2,h3,h4,h5,h6,a,em,i,b,strong,section,article,blockquote,td,th,aside,header,footer,nav,main,figcaption,dt,dd,ul,ol";
  return faces+
    "html,body{background:"+bg+" !important;color:"+fg+" !important;font-family:"+fam+" !important;font-size:"+fs+" !important;line-height:"+lh+" !important;}"+
    sel+"{font-family:"+fam+" !important;line-height:"+lh+" !important;}"+
    "body p,body div,body span,body li,body a,body em,body i,body b,body strong,body td,body th,body blockquote,body section,body article,body aside,body figcaption,body dt,body dd,body ul,body ol{font-size:inherit !important;}"+
    "a{color:"+fg+" !important;}";
}
function injectTypo(doc){
  if(!doc||!doc.head) return;
  try{
    if(doc.defaultView&&doc.defaultView.FontFace&&doc.fonts){
      Object.keys(loadedWebFaces).forEach(id=>{
        const rec=loadedWebFaces[id];
        const mark="data-clec-ff-"+rec.family;
        if(doc.documentElement.getAttribute(mark)) return;
        try{
          let ff;
          try{ ff=new doc.defaultView.FontFace(rec.family, rec.buf); }
          catch(e1){ ff=new doc.defaultView.FontFace(rec.family, 'url("'+rec.url+'") format("woff2")'); }
          doc.fonts.add(ff);
          ff.load().catch(function(){});
          doc.documentElement.setAttribute(mark,"1");
        }catch(e){}
      });
    }
  }catch(e){}
  let st=doc.getElementById("clec-typo");
  if(!st){
    st=doc.createElement("style");
    st.id="clec-typo";
    doc.head.appendChild(st);
  }
  st.textContent=typoCss(doc);
}
function applyEpubTypo(){
  if(!epubRend) return;

    if(epubRend.themes){
      epubRend.themes.font(fontStack(pref.font));
      epubRend.themes.fontSize((pref.fs||100)+"%");

      epubRend.themes.override("color", fg);

  try{
    const list=epubRend.getContents?epubRend.getContents():[];
    (list||[]).forEach(c=>{
      const doc=(c&&c.document)||(c&&c.content&&c.content.document)||c;
      injectTypo(doc);
    });
  }catch(e){}
}
function canvasHasFamily(family){

    const t="汉字阅读CLECmwmwmwll";

}
/* ---- 点选的 chip 上显示高亮进度条（字体/声音） ---- */
document.querySelectorAll(".row .chip").forEach(c=>{ c.dataset.label=c.textContent; });
const chipTimers={};
function chipOf(k,id){ return document.querySelector('.chip[data-k="'+k+'"][data-v="'+id+'"]'); }
function chipReset(c){
  c.classList.remove("loading","indet","err");
  c.style.removeProperty("--p"); c.style.minWidth="";
  c.removeAttribute("aria-busy");
  c.textContent=c.dataset.label;
}
function chipProgress(k,id,frac){
  const c=chipOf(k,id); if(!c) return;
  clearTimeout(chipTimers[k+id]);
  const label=c.dataset.label;
  if(!c.classList.contains("loading")){
    c.classList.remove("err","on");
    c.textContent=label+" 100%";
    if(c.offsetWidth>0) c.style.minWidth=c.offsetWidth+"px";
    c.classList.add("loading"); c.setAttribute("aria-busy","true");
  }
  if(frac==null){
    c.classList.add("indet"); c.style.removeProperty("--p"); c.textContent=label+" …";
  }else{
    const pct=Math.max(0,Math.min(100,Math.round(frac*100)));
    c.classList.remove("indet"); c.style.setProperty("--p",pct+"%"); c.textContent=label+" "+pct+"%";
  }
}
function chipDone(k,id){
  const c=chipOf(k,id); if(!c) return;
  clearTimeout(chipTimers[k+id]); chipReset(c);
}
function chipFail(k,id){
  const c=chipOf(k,id); if(!c) return;
  clearTimeout(chipTimers[k+id]); chipReset(c);
  c.classList.add("err"); c.textContent=c.dataset.label+" ✕ 失败";
  chipTimers[k+id]=setTimeout(()=>{ chipReset(c); applyChrome(); },4000);
}
/* fetch + ReadableStream：真实进度（有 Content-Length 时），否则 onProg(null)=不定长条纹 */
async function fetchBuf(u,onProg,ctl){
  const ac=ctl||new AbortController();
  let stall; const kick=()=>{ clearTimeout(stall); stall=setTimeout(()=>ac.abort(),25000); };
  kick();
  try{
    onProg(0);
    const res=await fetch(u,{signal:ac.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const total=Number(res.headers.get("Content-Length")||0);
    const enc=res.headers.get("Content-Encoding");
    const known=total>0&&(!enc||enc==="identity");
    if(!known) onProg(null);
    if(!res.body||!res.body.getReader){ kick(); return await res.arrayBuffer(); }
    const rd=res.body.getReader(); const chunks=[]; let rec=0;
    while(true){
      const r=await rd.read();
      if(r.done) break;
      kick(); chunks.push(r.value); rec+=r.value.length;
      if(known) onProg(Math.min(1,rec/total));
    }
    const out=new Uint8Array(rec); let off=0;
    chunks.forEach(c=>{ out.set(c,off); off+=c.length; });
    return out.buffer;
  }finally{ clearTimeout(stall); }
}
async function loadWebFont(id){

  if(webFontPending[id]) return webFontPending[id];
  const meta=WEB_FONTS[id];
  if(!meta) return false;
  const href=new URL(meta.file, LOCAL).href;
  webFontPending[id]=(async()=>{
    const buf=await fetchBuf(href,f=>chipProgress("font",id,f));
    chipProgress("font",id,1);
    const face=new FontFace(meta.family, buf);
    await withTimeout(Promise.resolve(face.load()), 20000, "字体");
    document.fonts.add(face);
    loadedWebFaces[id]={family:meta.family,url:href,face:face,buf:buf};
    chipDone("font",id);
    return true;
  })();
  try{ return await webFontPending[id]; }
  catch(e){ delete webFontPending[id]; chipFail("font",id); return false; }
}
async function loadLocalFont(id){
  if(localFontOk[id]) return true;
  const meta=LOCAL_FONTS[id];
  if(!meta||!document.fonts||!window.FontFace) return false;
  const src=meta.locals.map(n=>'local("'+n+'")').join(", ");
  const face=new FontFace(meta.family, src);
  chipProgress("font",id,null);
  try{
    await withTimeout(Promise.resolve(face.load()), 4000, "字体");
    document.fonts.add(face);
    const ok=document.fonts.check('16px "'+meta.family+'"') && canvasHasFamily(meta.family);
    if(ok){ localFontOk[id]=true; chipDone("font",id); }
    else chipFail("font",id);
    return ok;
  }catch(e){ chipFail("font",id); return false; }
}

/* ---- 背景音：录音仅在点选时加载；粉噪/轻柔仍本地生成 ---- */
const noiseCache={};
function noiseBuf(sec, kind){
  const key=kind+"_"+sec;
  if(noiseCache[key]) return noiseCache[key];
  const rate=actx.sampleRate, n=Math.floor(rate*sec);
  const buf=actx.createBuffer(1,n,rate), d=buf.getChannelData(0);
  if(kind==="white"){
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }else if(kind==="brown"){
    let last=0;
    for(let i=0;i<n;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=Math.max(-1,Math.min(1,last*3.5)); }
  }else{
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
      b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
  }
  return noiseCache[key]=buf;
}
function track(n){ soundNodes.push(n); return n; }
function loopSrc(buf){ const s=actx.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return track(s); }
function filt(type,freq,q){ const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q!=null) f.Q.value=q; return track(f); }
function gain(v){ const g=actx.createGain(); g.gain.value=v; return track(g); }
function lfoTo(param,freq,depth){
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=freq;
  const g=actx.createGain(); g.gain.value=depth;
  o.connect(g); g.connect(param); o.start(); track(o); track(g); return o;
}
function later(fn,ms){ const id=setTimeout(fn,ms); soundTimers.push(id); return id; }

/* ---- Web Audio：录音解码后用 AudioBufferSourceNode 无缝循环 ---- */
function ensureCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  if(!actx){ try{ actx=new AC({latencyHint:"playback"}); }catch(e){ actx=new AC(); } }
  try{ if(actx.state!=="running"){ const p=actx.resume(); if(p&&p.catch) p.catch(function(){}); } }catch(e){}
  return actx;
}
function silentWavUrl(){
  const n=4000, b=new ArrayBuffer(44+n*2), v=new DataView(b);
  const w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVEfmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
/* 只在用户点击里调用：让 iOS Safari 的 WebAudio 在静音拨片开启时也能出声 */
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  try{ const bf=actx.createBuffer(1,1,22050), sn=actx.createBufferSource(); sn.buffer=bf; sn.connect(actx.destination); sn.start(0); }catch(e){}
  if(!navigator.audioSession){
    try{
      if(!silentEl){ silentEl=new Audio(silentWavUrl()); silentEl.loop=true; silentEl.setAttribute("playsinline",""); silentEl.volume=0.01; }
      const p=silentEl.play(); if(p&&p.catch) p.catch(function(){});
    }catch(e){}
  }
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && actx && playingSound!=="off" && actx.state!=="running"){ try{ const p=actx.resume(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
});
document.addEventListener("pointerdown",function(){
  if(actx && playingSound!=="off" && actx.state!=="running"){ try{ const p=actx.resume(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
},true);

function decodeAudio(ac,ab){
  return new Promise(function(res,rej){
    try{ const p=ac.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }catch(e){ rej(e); }
  });
}
/* 去掉 MP3 编码器填充/淡入淡出造成的静音，并把循环点做成等功率交叉淡化，循环点无空白、无爆音。
   在解码后的 buffer 上原地处理：循环区间 [loopStart, loopEnd)，区间尾部 xf 长度的内容混入开头。 */
function prepareLoop(buf){
  const sr=buf.sampleRate, n=buf.length, nc=buf.numberOfChannels;
  const chans=[]; for(let c=0;c<nc;c++) chans.push(buf.getChannelData(c));
  const win=Math.max(1,Math.round(sr*0.02)), nw=Math.floor(n/win);
  let s=0, e=n;
  if(nw>=40){
    const rms=new Float32Array(nw);
    for(let w=0;w<nw;w++){
      let acc=0;
      for(let c=0;c<nc;c++){ const d=chans[c]; for(let i=w*win,m=i+win;i<m;i++) acc+=d[i]*d[i]; }
      rms[w]=Math.sqrt(acc/(win*nc));
    }
    const mid=Array.prototype.slice.call(rms,Math.floor(nw*0.2),Math.ceil(nw*0.8)).sort((a,b)=>a-b);
    const ref=mid[mid.length>>1]||0;
    if(ref>0){
      const thr=ref*0.75;                                   /* 低于稳态响度 75% 的开头/结尾视为填充或淡变 */
      const maxW=Math.min(Math.floor(1.5/0.02), Math.floor(nw*0.1));
      let i=0; while(i<maxW && rms[i]<thr) i++;
      let j=nw-1, k=0; while(k<maxW && rms[j]<thr){ j--; k++; }
      s=i*win; e=(j+1)*win;
    }
  }
  if(e-s<sr*2){ s=0; e=n; }
  const xf=Math.max(1,Math.min(Math.round(sr*0.8), Math.floor((e-s)/4)));
  for(let c=0;c<nc;c++){
    const d=chans[c];
    for(let i=0;i<xf;i++){
      const t=(i+0.5)/xf, a=Math.sin(t*Math.PI/2), b=Math.cos(t*Math.PI/2);
      d[s+i]=d[s+i]*a+d[e-xf+i]*b;
    }
  }
  return {buffer:buf, loopStart:s/sr, loopEnd:(e-xf)/sr};
}
const soundCache=[];
function cacheGet(id){ for(let i=0;i<soundCache.length;i++) if(soundCache[i].id===id) return soundCache[i].rec; return null; }
function cacheSet(id,rec){ soundCache.unshift({id:id,rec:rec}); while(soundCache.length>3) soundCache.pop(); }

function playLoop(rec){
  const src=actx.createBufferSource();
  src.buffer=rec.buffer;
  src.loop=true;
  src.loopStart=rec.loopStart;
  src.loopEnd=rec.loopEnd;
  masterGain=actx.createGain();
  const now=actx.currentTime;
  masterGain.gain.setValueAtTime(0,now);
  masterGain.gain.linearRampToValueAtTime(0.7,now+1.5);
  src.connect(masterGain); masterGain.connect(actx.destination);
  src.start(0, rec.loopStart);
  track(src);
}
function stopSound(){
  soundReq++;
  if(loadingSound){ const id=loadingSound; loadingSound=null; try{ soundAbort&&soundAbort.abort(); }catch(e){} chipDone("sound",id); }
  soundTimers.forEach(clearTimeout); soundTimers=[];
  const nodes=soundNodes.slice(), mg=masterGain;
  soundNodes=[]; masterGain=null; playingSound="off";
  if(actx&&mg){
    try{ const t=actx.currentTime; mg.gain.cancelScheduledValues(t); mg.gain.setValueAtTime(mg.gain.value,t); mg.gain.linearRampToValueAtTime(0,t+0.45);}catch(e){}
    setTimeout(()=>{ nodes.forEach(n=>{try{n.stop&&n.stop(); n.disconnect();}catch(e){}}); try{mg.disconnect();}catch(e){} }, 520);
  }
  setTimeout(()=>{ if(silentEl && playingSound==="off" && !loadingSound){ try{ silentEl.pause(); }catch(e){} } }, 600);
}

function startProcSound(id){
  if(!ensureCtx()){ playingSound="off"; applyChrome(); return; }
  unlockAudio();
  stopSound();
  if(!id||id==="off"){ applyChrome(); return; }
  masterGain=actx.createGain(); masterGain.gain.value=0; masterGain.connect(actx.destination);
  const out=masterGain, now=actx.currentTime;
  out.gain.setValueAtTime(0,now);
  if(id==="pink"){
    const a=loopSrc(noiseBuf(4,"pink")), lp=filt("lowpass",6000), g=gain(0.16);
    a.connect(lp); lp.connect(g); g.connect(out);
    out.gain.linearRampToValueAtTime(0.7, now+0.8);
  }else{
    const make=(freq,type,detune)=>{
      const o=actx.createOscillator(); o.type=type; o.frequency.value=freq; o.detune.value=detune;
      const g=gain(0.35), f=filt("lowpass",900);
      o.connect(g); g.connect(f); f.connect(out); o.start(); return track(o);
    };
    make(110,"sine",0); make(164.81,"sine",6); make(220,"triangle",-4);
    lfoTo(out.gain,0.07,0.012);
    out.gain.linearRampToValueAtTime(0.045, now+1.2);
  }
  playingSound=id;
}

async function startFileSound(id){
  const rel=FILE_SOUNDS[id];
  /* 以下同步部分必须在点击事件里执行：创建/恢复 AudioContext（iOS Safari） */
  if(!ensureCtx()){ stopSound(); setStatus("此浏览器不能播放背景音，书仍可继续阅读。"); applyChrome(); return; }
  unlockAudio();
  stopSound();
  if(!rel){ applyChrome(); return; }
  const req=soundReq;
  const ctl=new AbortController(); soundAbort=ctl; loadingSound=id;
  applyChrome();
  try{
    let rec=cacheGet(id);
    if(!rec){
      chipProgress("sound",id,0);
      const raw=await fetchBuf(new URL(rel, LOCAL).href, f=>{ if(req===soundReq) chipProgress("sound",id,f==null?null:f*0.92); }, ctl);
      if(req!==soundReq) return;
      chipProgress("sound",id,0.95);
      const buf=await decodeAudio(actx,raw);
      if(req!==soundReq) return;
      rec=prepareLoop(buf);
      cacheSet(id,rec);
    }
    if(req!==soundReq) return;
    if(actx.state!=="running"){ try{ await actx.resume(); }catch(e){} }
    playLoop(rec);
    playingSound=id; loadingSound=null;
    chipDone("sound",id);
  }catch(e){
    if(req!==soundReq) return;
    console.warn("sound failed", e);
    loadingSound=null; playingSound="off";
    chipFail("sound",id);
    setStatus("背景音加载失败，可改选其他声音或关闭。书仍可继续阅读。");
  }finally{
    if(req===soundReq) applyChrome();
  }
}

function startSound(id){
  if(!id||id==="off"){ stopSound(); applyChrome(); return; }
  if(FILE_SOUNDS[id]) startFileSound(id);
  else startProcSound(id);
  applyChrome();
}

  pref.sound=id; pref.music=(id!=="off"); savePref();
  setStatus("");
  startSound(id);
  applyChrome();
}

function withTimeout(p,ms,label){
  return Promise.race([
    p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||"加载")+"超时")),ms))
  ]);
}
function loadScript(src,ms){
  ms=ms||8000;
  return withTimeout(new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.async=true;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("脚本加载失败: "+src));
    document.head.appendChild(s);
  }), ms, "脚本");
}

async function openPdf(){
  msgt.textContent="正在加载阅读组件…";
  document.getElementById("hint").textContent="不用下载整本，只加载当前页。打开后翻页会快很多。";
  const sources=[
    {pdf:LOCAL+"pdfjs/build/pdf.mjs", worker:LOCAL+"pdfjs/build/pdf.worker.mjs", cmap:LOCAL+"pdfjs/web/cmaps/", font:LOCAL+"pdfjs/web/standard_fonts/"},
    {pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs", worker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs", cmap:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/", font:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/"},
    {pdf:"https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs", worker:"https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs", cmap:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/", font:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/"}
  ];
  let pdfjsLib=null, src=null;
  for(const s of sources){
    try{ pdfjsLib=await loadModule(s.pdf, 8000); src=s; break; }
    catch(e){ console.warn("pdf.js 加载失败", s.pdf, e); }
  }
  if(!pdfjsLib){ msgt.textContent="阅读组件加载失败，请检查网络后刷新，或点右上角「下载」。"; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc=src.worker;
  msgt.textContent="正在打开第一页…";
  try{
    const task=pdfjsLib.getDocument({
      url,
      cMapUrl:src.cmap,
      cMapPacked:true,
      standardFontDataUrl:src.font,
      disableAutoFetch:true,
      disableStream:false,
      disableRange:false,
      rangeChunkSize:262144,
      withCredentials:false
    });
    const pdf=await task.promise;
    let pageNo=Math.max(1, parseInt(localStorage.getItem("clec-pdf:"+key)||"1",10)||1);
    if(pageNo>pdf.numPages) pageNo=1;
    view.classList.add("pdf");
    const canvas=document.createElement("canvas");
    view.appendChild(canvas);
    let rendering=false, pending=null;
    async function render(n){
      if(rendering){pending=n;return;}
      rendering=true; pageNo=n;
      localStorage.setItem("clec-pdf:"+key, String(n));
      const page=await pdf.getPage(n);
      const vw=Math.max(280, view.clientWidth||document.documentElement.clientWidth);
      const unscaled=page.getViewport({scale:1});
      const scale=Math.min(2.4, (vw-8)/unscaled.width) * (window.devicePixelRatio||1);
      const vp=page.getViewport({scale});
      canvas.width=vp.width; canvas.height=vp.height;
      canvas.style.width=Math.floor(vp.width/(window.devicePixelRatio||1))+"px";
      canvas.style.height=Math.floor(vp.height/(window.devicePixelRatio||1))+"px";
      await page.render({canvasContext:canvas.getContext("2d",{alpha:false}), viewport:vp}).promise;
      posEl.innerHTML='<input id="pg" type="number" min="1" max="'+pdf.numPages+'" value="'+n+'"> / '+pdf.numPages;
      const inp=document.getElementById("pg");
      inp.onchange=()=>{const v=Math.min(pdf.numPages, Math.max(1, parseInt(inp.value,10)||1)); render(v);};
      msg.classList.add("hide");
      rendering=false;
      if(pending && pending!==n){const p=pending;pending=null;render(p);}
      else pending=null;
    }
    goPrev=()=>{if(pageNo>1) render(pageNo-1);};
    goNext=()=>{if(pageNo<pdf.numPages) render(pageNo+1);};
    applyBookStyle=()=>{/* PDF 版面固定，仅背景随主题 */};
    await render(pageNo);
    applySavedFont().catch(function(){});
    let x0=null;
    view.addEventListener("touchstart",e=>{x0=e.changedTouches[0].screenX;},{passive:true});
    view.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].screenX-x0;if(dx>50)goPrev();if(dx<-50)goNext();x0=null;},{passive:true});
  }catch(e){
    console.error(e);
    msgt.textContent="打开失败，请检查网络后刷新，或点右上角「下载」。";
  }
}

    try{
      if(rend.hooks&&rend.hooks.content&&rend.hooks.content.register){
        rend.hooks.content.register(function(contents){
          try{ injectTypo(contents.document||(contents.content&&contents.content.document)); }catch(err){}
        });
      }
    }catch(e){}
    try{
      rend.on("rendered", function(section, view){
        try{
          const doc=(view&&view.document)||(view&&view.contents&&view.contents.document);
          if(doc) injectTypo(doc);
          else applyEpubTypo();
        }catch(err){ try{ applyEpubTypo(); }catch(e2){} }
      });
    }catch(e){}
    const saved=localStorage.getItem("clec-pos:"+key);
    try{
      await withTimeout(rend.display(saved||undefined), 20000, "排版");
    }catch(err){
      if(saved){ try{ localStorage.removeItem("clec-pos:"+key); }catch(e){} await withTimeout(rend.display(), 20000, "排版"); }
      else throw err;
    }
    applyBookStyle();
    msg.classList.add("hide");
    applySavedFont().catch(function(){});
    window.addEventListener("resize",()=>{
      const nw=Math.max(280, view.clientWidth||window.innerWidth);
      const nh=Math.max(320, view.clientHeight||(window.innerHeight-96));
      if(rend.resize) rend.resize(nw, nh);
    });
    book.loaded.navigation.then(nav=>{
      const sel=document.getElementById("toc");
      const add=(items,d)=>items.forEach(i=>{const o=document.createElement("option");o.value=i.href;o.textContent="　".repeat(d)+(i.label||"").trim();sel.appendChild(o);if(i.subitems)add(i.subitems,d+1);});
      add(nav.toc,0);
      sel.onchange=()=>{if(sel.value) rend.display(sel.value); sel.selectedIndex=0;};
    });
    rend.on("relocated",loc=>{
      localStorage.setItem("clec-pos:"+key, loc.start.cfi);
      const p=loc.start.displayed;
      posEl.textContent=p?("本章 "+p.page+" / "+p.total):"";
    });
    goPrev=()=>rend.prev();
    goNext=async()=>{
      const before=rend.currentLocation && rend.currentLocation();
      await rend.next();
      const after=rend.currentLocation && rend.currentLocation();
      if(before && after && before.start && after.start && before.start.cfi===after.start.cfi){
        const idx=before.start.index;
        const item=book.spine.get(idx+1);
        if(item) rend.display(item.href);
      }
    };
    let x0=null;
    view.addEventListener("touchstart",e=>{x0=e.changedTouches[0].screenX;},{passive:true});
    view.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].screenX-x0;if(dx>50)goPrev();if(dx<-50)goNext();x0=null;},{passive:true});
  }catch(e){
    console.error(e);
    msgt.textContent="打开失败，请检查网络后刷新，或点右上角「下载」。";
  }
}

async function downloadWithProgress(u){
  const bar=document.getElementById("prog"); const i=bar.querySelector("i");
  bar.style.display="block";
  const res=await fetch(u);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const total=Number(res.headers.get("Content-Length")||0);
  if(!res.body||!res.body.getReader) return await res.arrayBuffer();
  const reader=res.body.getReader();
  const chunks=[]; let rec=0;
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    chunks.push(value); rec+=value.length;
    if(total){ i.style.width=Math.min(100, rec/total*100)+"%"; msgt.textContent="正在加载 "+(rec/1e6).toFixed(1)+" / "+(total/1e6).toFixed(1)+" MB"; }
    else { msgt.textContent="正在加载 "+(rec/1e6).toFixed(1)+" MB"; }
  }
  const out=new Uint8Array(rec); let off=0;
  chunks.forEach(c=>{out.set(c,off);off+=c.length;});
  return out.buffer;
}
